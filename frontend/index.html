<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/fonts/brand-fonts.css" />
    <link
      rel="preload"
      href="/fonts/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#15384a" />
    <meta
      name="description"
      content="上海罗加国际货物运输代理有限公司 logisticspluscn：货物运输追踪、装箱规划与业务协作工作台。"
    />
    <title>logisticspluscn · 上海罗加国际货物运输代理有限公司</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }
      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f2f5f6;
        color: #15384a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .boot-card {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }
      .boot-card img {
        width: 44px;
        height: 44px;
      }
      .boot-card strong {
        font-size: 22px;
      }
      .boot-card p {
        font-size: 12px;
        color: #617581;
      }
      .boot-card button {
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid #15384a;
        border-radius: 2px;
        background: #15384a;
        color: white;
        cursor: pointer;
      }
      .boot-card button:focus-visible {
        outline: 3px solid #157a9d;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-card">
          <img src="/favicon.svg" alt="" /><strong>logisticspluscn</strong>
          <p>正在加载 · Loading</p>
        </div>
      </div>
    </div>
    <noscript>请启用 JavaScript 以使用本平台。 / Enable JavaScript to use this platform.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
