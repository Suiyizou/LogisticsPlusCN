# The cloud tracking container serves the existing workspace and its browser
# assets only. Carrier queries are authenticated and executed by the Java backend.
map $uri $cloud_tracking_frame_options {
  default DENY;
  / SAMEORIGIN;
  /index.html SAMEORIGIN;
}

map $uri $cloud_tracking_frame_ancestors {
  default "'none'";
  / "'self'";
  /index.html "'self'";
}

map "$status:$uri" $cloud_tracking_cache_control {
  default "no-cache, must-revalidate";
  "~^[45][0-9][0-9]:" "no-store";
  "~^[0-9]+:/api/flags/" "public, max-age=604800";
  "~^[0-9]+:/api/" "no-store";
  "~^[0-9]+:/vendor/pdfjs/6[.]4[.]299/" "public, max-age=31536000, immutable";
  "~^[0-9]+:/vendor/flags/" "public, max-age=604800";
  "~^[0-9]+:/vendor/xlsx[.]mjs$" "public, max-age=604800";
  "~^[0-9]+:/$" "no-cache, no-store, must-revalidate";
  "~[.]html$" "no-cache, no-store, must-revalidate";
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  etag on;
  client_max_body_size 2m;
  client_body_timeout 15s;

  # .mjs and PDF.js data/worker resources need explicit browser-safe MIME types.
  types {
    text/html html;
    text/css css;
    text/plain txt;
    text/markdown md;
    application/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/gif gif;
    image/webp webp;
    image/x-icon ico;
    font/woff woff;
    font/woff2 woff2;
    font/ttf ttf;
    application/wasm wasm;
    application/vnd.iccprofile icc;
    application/octet-stream bcmap pfb;
  }
  default_type application/octet-stream;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options $cloud_tracking_frame_options always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; frame-ancestors $cloud_tracking_frame_ancestors; base-uri 'none'; object-src 'none'" always;
  add_header Cache-Control $cloud_tracking_cache_control always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Container health describes this static server, not the desktop Chrome or tunnel.
  location = /api/health {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    default_type application/json;
    return 200 '{"ok":true,"runtime":"STATIC_ONLY","browserRuntime":false,"trackingExecution":"LOCAL_API"}';
  }

  location ~ "^/api/channels/(?:network|c)/status$" {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    default_type application/json;
    return 200 '{"status":"unknown","enabled":false,"reason":"LOCAL_API_ONLY","lastCheckedAt":null,"nextCheckAt":null,"lastError":null}';
  }

  # The unchanged workspace uses these extensionless URLs for country flags.
  location ~ "^/api/flags/(?<cloud_flag_ratio>1x1|4x3)/(?<cloud_flag_country>[a-z]{2})$" {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    default_type image/svg+xml;
    alias /usr/share/nginx/html/vendor/flags/$cloud_flag_ratio/$cloud_flag_country.svg;
  }

  # Legacy carrier execution, channel checks and queue endpoints are gone.
  location /api/ {
    default_type application/json;
    return 410 '{"code":"TRACKING_CLOUD_ADAPTER_REMOVED","error":{"message":"Cloud carrier execution has been removed; use the platform tracking API","details":{"code":"TRACKING_CLOUD_ADAPTER_REMOVED"}}}';
  }

  # Match the former Node router's exact PDF.js allowlist. Merely copying an
  # additional file into public/vendor must never expose sandbox/eval/tooling code.
  location ~ "^/vendor/pdfjs/6[.]4[.]299/(?:legacy/build/pdf(?:[.]worker)?[.]mjs|wasm/(?:openjpeg_nowasm_fallback[.]js|jbig2_nowasm_fallback[.]js|openjpeg[.]wasm|jbig2[.]wasm|qcms_bg[.]wasm)|iccs/CGATS001Compat-v2-micro[.]icc|cmaps/[A-Za-z0-9_-]+[.]bcmap|standard_fonts/(?:Foxit[A-Za-z]+[.]pfb|LiberationSans-(?:Bold|BoldItalic|Italic|Regular)[.]ttf))$" {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files $uri =404;
  }

  location /vendor/pdfjs/ {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    return 404;
  }

  location / {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files $uri $uri/ =404;
  }
}
