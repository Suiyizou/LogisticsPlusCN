# Gitee Go 流水线配置。
#
# 与本地完全共用同一套命令：`node scripts/verify.mjs`。
# 也就是说 CI 不是另一套逻辑，本地能跑绿，CI 才可能跑绿。
#
# 需要在 Gitee 控制台：
#   1. 仓库 → 流水线 → 开通 Gitee Go；
#   2. 选择“自定义流水线”，把本文件作为流水线配置（或新建后替换内容）；
#   3. 如果要推送镜像，在“变量/凭据”里配置 DOCKER_REGISTRY / DOCKER_USERNAME /
#      DOCKER_PASSWORD，不要在 YAML 里写明文。
#
# 注意：
#   - 数据库迁移验收与镜像构建需要 Docker-capable Runner；Docker 不可用时明确失败，
#     不能删除数据库质量门或把未运行标成通过。
#   - 质量门必须拿到可信变更基线：优先用 Gitee 提供的前一提交 SHA；若该变量不可用，
#     quality.mjs 会在 CI 下退回 HEAD~1。因此 Runner 必须能访问足够历史（非浅克隆）。
#     若拿不到基线，质量门会直接失败（不会静默只检查 scripts）。
version: "1.0"
name: ci
displayName: CI（校验 + 测试 + 镜像构建）

triggers:
  push:
    branches:
      include:
        - ".*"
  pr:
    branches:
      include:
        - ".*"

stages:
  - stage:
      name: verify
      displayName: 质量门与测试
      steps:
        # 前端/追踪/脚本：质量门、类型检查、单元测试、生产构建。
        - step: build@nodejs
          name: node_checks
          displayName: Node 质量门 + 类型检查 + 测试 + 前端构建
          nodeVersion: "20"
          commands:
            - npm ci --include=dev
            - npm --prefix frontend ci --include=dev --ignore-scripts
            - npm --prefix tracking-service ci
            - QUALITY_BASE_REF="${GITEE_PIPELINE_BEFORE_SHA:-}" node scripts/quality.mjs
            - node scripts/verify.mjs modules
            - npm --prefix frontend run typecheck
            - node scripts/verify.mjs customers release
            - npm --prefix tracking-service test
            - npm --prefix frontend run test:packing
            - npm --prefix frontend run build

        # 后端：JUnit 全部测试 + Checkstyle（绑定在 validate 阶段）。
        - step: build@maven
          name: backend_tests
          displayName: 后端测试
          jdkVersion: "17"
          commands:
            - cd backend && mvn -B -q test

  # This mandatory stage needs a Docker-capable Runner. Missing Docker is a failure, not a skip.
  # Maven/Java use the same Docker build target as production; no host JDK/Maven installation required.
  - stage:
      name: database_migrations
      displayName: MySQL 8.4 新旧库迁移验收
      steps:
        - step: build@nodejs
          name: mysql_migration_matrix
          displayName: 空库 / 历史库 / 幂等 / 权限数据 / 结构一致性
          nodeVersion: "20"
          commands:
            - node --test scripts/test/schema-equivalence.test.mjs
            - node scripts/verify-database-ci.mjs

  - stage:
      name: images
      displayName: 构建镜像
      steps:
        # Use explicit CLI contexts; -f does not change Docker's context directory.
        # Like the migration job, this Node step requires a Docker-capable Runner.
        - step: build@nodejs
          name: build_images
          displayName: 后端 / 追踪 / 前端生产镜像
          nodeVersion: "20"
          commands:
            - docker info
            - node scripts/verify-staging-compose.mjs
            - docker build --file docker/backend.Dockerfile --tag "cargo-planner-backend:${GITEE_PIPELINE_BUILD_NUMBER:?missing build number}" .
            - docker build --file tracking-service/Dockerfile --tag "cargo-platform-tracking:${GITEE_PIPELINE_BUILD_NUMBER:?missing build number}" tracking-service
            - docker build --file docker/frontend.Dockerfile --tag "cargo-planner-frontend:${GITEE_PIPELINE_BUILD_NUMBER:?missing build number}" .

  # Opt-in test deployment. Credentials must be scoped to the protected release branch.
  # No production deployment is configured here.
  - stage:
      name: staging_deploy
      displayName: 隔离测试环境部署（按需启用）
      steps:
        - step: build@nodejs
          name: deploy_staging
          displayName: 指定提交部署到测试服务器
          nodeVersion: "20"
          commands:
            - node scripts/ci-staging-deploy.mjs
