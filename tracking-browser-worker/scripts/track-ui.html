<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>货物追踪 · 运单查询</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --line:#e6ebf2; --line2:#eef2f7;
    --text:#1f2937; --muted:#7b8794; --brand:#1a5cff; --brand-soft:#eaf1ff;
    --ok:#10b981; --ok-soft:#e8f8f1; --warn:#f59e0b; --warn-soft:#fef4e6; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .layout{display:grid;grid-template-columns:196px 1fr;min-height:100vh}

  /* ---------- 侧边栏 ---------- */
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:8px;padding:4px 6px 18px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#1a5cff,#7aa2ff);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.3px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:#46505f;text-decoration:none;font-size:13px}
  .nav a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav a.sub{padding-left:26px;font-size:12.5px;color:var(--muted)}
  .nav a.sub.active{background:var(--brand-soft);color:var(--brand)}
  .side .user{margin-top:auto;display:flex;gap:8px;align-items:center;padding:10px 6px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted)}

  /* ---------- 顶栏 ---------- */
  .main{display:flex;flex-direction:column;min-width:0}
  .top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;color:var(--muted)}
  .top .crumbs b{color:var(--text);font-weight:600}
  .top .right{display:flex;gap:16px;align-items:center}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}

  /* ---------- 内容 ---------- */
  .content{padding:22px 26px 60px;max-width:1180px}
  h1{font-size:24px;margin:4px 0 6px}
  .desc{color:var(--muted);font-size:13px;margin-bottom:18px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 14px;color:var(--muted);font-weight:600;letter-spacing:.04em}

  .query{display:grid;grid-template-columns:1fr 1fr 1.6fr auto;gap:14px;align-items:end}
  @media(max-width:1000px){.query{grid-template-columns:1fr 1fr}}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  select,input[type=text]{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:0 12px;font-size:13.5px;outline:none}
  select:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,92,255,.12)}
  .btn{height:40px;padding:0 22px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text);font-weight:500}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .drop{flex:1;min-width:260px;border:1px dashed var(--line);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fbfcfe}
  .drop.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

  /* ---------- 动效 ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,92,255,.45)}70%{box-shadow:0 0 0 12px rgba(26,92,255,0)}100%{box-shadow:0 0 0 0 rgba(26,92,255,0)}}
  @keyframes shimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floatIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .card{animation:fadeUp .38s cubic-bezier(.22,.61,.36,1) both}
  .card:nth-of-type(2){animation-delay:.05s}
  .card:nth-of-type(3){animation-delay:.1s}
  .nodes:before{transform-origin:left;animation:growX .9s cubic-bezier(.22,.61,.36,1) both}
  .node{animation:pop .45s cubic-bezier(.22,.61,.36,1) both}
  .node:nth-child(2){animation-delay:.08s}
  .node:nth-child(3){animation-delay:.16s}
  .node:nth-child(4){animation-delay:.24s}
  .node.done .icon{animation:pulse 2.4s ease-out infinite}
  .node .nearest{animation:floatIn .5s ease both;animation-delay:.4s}
  .btn{transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
  .btn:hover{box-shadow:0 6px 18px rgba(26,92,255,.28)}
  .btn:active{transform:scale(.97)}
  .btn.loading{position:relative;color:transparent}
  .btn.loading:after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .skeleton{background:linear-gradient(90deg,#f1f5fa 25%,#e8eef7 37%,#f1f5fa 63%);background-size:420px 100%;animation:shimmer 1.2s linear infinite;border-radius:6px;height:12px;margin:8px 0}
  .table tbody tr{animation:fadeUp .3s ease both}
  .table tbody tr:nth-child(-n+12){animation-delay:calc(var(--i,0)*30ms)}

  /* ---------- 导入面板（自己的识别交互） ---------- */
  .import{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px;transition:border-color .2s,box-shadow .2s}
  .import.dragging{border-color:var(--brand);box-shadow:0 0 0 4px rgba(26,92,255,.1)}
  .import .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#fbfcfe;border-bottom:1px solid var(--line2);font-size:13px}
  .import .head b{font-size:13px}
  .import .body{padding:14px}
  .zone{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:.2s;background:#fff}
  .zone:hover{border-color:var(--brand);background:var(--brand-soft)}
  .zone .ico{font-size:26px;line-height:1;margin-bottom:8px}
  .zone .t{font-size:13.5px;font-weight:600;margin-bottom:4px}
  .zone .s{font-size:12px;color:var(--muted)}
  .rows{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-height:150px;overflow:auto}
  .rowchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;animation:pop .25s ease both}
  .rowchip.bad{border-color:#f5c2c0;background:#fdf1f0;color:#c0392b}
  .rowchip code{font:11.5px ui-monospace,Menlo,monospace;color:#0f4bd8;background:var(--brand-soft);border-radius:4px;padding:1px 5px}
  .rowchip .x{cursor:pointer;color:var(--muted);font-weight:700}
  .progressbar{height:3px;background:var(--line2);overflow:hidden;border-radius:2px;margin-top:10px}
  .progressbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#7aa2ff);transition:width .35s ease}
  .statline{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .statline b{color:var(--text)}

  /* ---------- 汇总条 ---------- */
  .summary{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.1fr 1.1fr;gap:16px;align-items:start}
  @media(max-width:1000px){.summary{grid-template-columns:1fr 1fr}}
  .summary .k{font-size:12px;color:var(--muted);margin-bottom:4px}
  .summary .v{font-size:15px;font-weight:600}
  .summary .v.big{font-size:20px}
  .summary .v small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .rowline{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:13px}
  .rowline .tag{color:var(--muted);font-size:12px}
  .statusline{margin-top:12px;padding:10px 12px;background:#f8fafd;border:1px solid var(--line2);border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block}
  .dot.ok{background:var(--ok)}

  /* ---------- 节点 ---------- */
  .nodes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:26px 4px 6px}
  .nodes:before{content:"";position:absolute;left:8%;right:8%;top:44px;height:2px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand) 46%,var(--line) 46%,var(--line) 100%)}
  .node{position:relative;text-align:center;padding-top:0}
  .node .icon{width:38px;height:38px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:16px;background:#fff;border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
  .node.done .icon{background:var(--brand);border-color:var(--brand);color:#fff}
  .node .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-bottom:6px}
  .node.done .badge{background:var(--ok-soft);color:#0e9f6e}
  .node.todo .badge{background:var(--warn-soft);color:#b45309}
  .node .label{font-size:13px;font-weight:600;margin-bottom:2px}
  .node .loc{font-size:13px;color:var(--text)}
  .node .name{font-size:12px;color:var(--brand);margin-top:2px}
  .node .time{font-size:12px;color:var(--muted);margin-top:4px}
  .node .time.actual{color:var(--text)}
  .node .nearest{display:inline-block;margin-top:6px;font-size:11px;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 8px}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2)}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fbfcfe}
  td code{font:12px ui-monospace,Menlo,monospace;color:#0f4bd8;background:var(--brand-soft);border-radius:4px;padding:1px 6px}
  .muted{color:var(--muted)}
  .badge-sm{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
  .badge-sm.ok{background:var(--ok-soft);color:#0e9f6e}
  .badge-sm.bad{background:#fdecec;color:#c0392b}
  .warn{background:var(--warn-soft);border:1px solid #f7e0b8;color:#8a5a00;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
  .empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
  .log{max-height:96px;overflow:auto;font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;margin-top:10px}
  .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs button{background:none;border:0;padding:8px 2px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="logo">LP</div>
      <div><b>logisticspluscn</b><small>上海罗宾国际货运代理有限公司</small></div>
    </div>
    <nav class="nav">
      <a href="#">▦ 工作台首页</a>
      <a href="#" class="active">▤ 运输跟踪</a>
      <a href="#" class="sub">跟踪总览</a>
      <a href="#" class="sub active">运单查询</a>
      <a href="#">▥ 装箱工具</a>
      <a href="#">▧ 业务协同</a>
      <a href="#">⚙ 系统管理</a>
    </nav>
    <div class="user"><span class="avatar">UI</span><div>ui-preview<br><small>本地验收管理员</small></div></div>
  </aside>

  <div class="main">
    <div class="top">
      <div class="crumbs">工作台 / <b>货物追踪工作台</b></div>
      <div class="right"><span>中 / EN</span><span>🔔</span><span class="avatar">UI</span></div>
    </div>

    <div class="content">
      <h1>货物追踪</h1>
      <p class="desc">从起运港到目的港，掌握货物运输进展。请选择船公司，并输入对应的货运参考号。</p>

      <!-- 查询 -->
      <div class="card">
        <div class="query">
          <div class="field"><label>船司</label>
            <select id="carrier">
              <option value="COSCO">COSCO SHIPPING</option>
              <option value="SML">SM LINE</option>
              <option value="HMM">HMM</option>
              <option value="OOCL">OOCL</option>
              <option value="MSC">MSC</option>
              <option value="EVERGREEN">EVERGREEN</option>
              <option value="YML">YANG MING</option>
              <option value="ZIM">ZIM</option>
              <option value="ONE">ONE</option>
              <option value="KMTC">KMTC</option>
              <option value="MAERSK">MAERSK</option>
              <option value="HAPAG_LLOYD">HAPAG-LLOYD</option>
              <option value="MATSON">MATSON</option>
            </select>
          </div>
          <div class="field"><label>运输单号类型</label>
            <select id="refType">
              <option value="">自动识别</option>
              <option value="book">订舱号</option>
              <option value="bl">提单号</option>
              <option value="container">箱号</option>
            </select>
          </div>
          <div class="field"><label>运输单号</label>
            <input type="text" id="reference" placeholder="6466209120">
          </div>
          <button class="btn" id="query">🔍 查 询</button>
        </div>

        <div class="tools">
          <input type="text" id="token" placeholder="令牌（可选）" style="max-width:180px;height:36px">
          <span class="muted" style="font-size:12.5px">单票查询用上面的表单；批量用下面的导入面板</span>
        </div>

        <div class="import" id="import">
          <div class="head">
            <b>批量导入</b>
            <span class="muted" style="font-size:12px">支持 CSV / TSV / 从 Excel 直接粘贴 · 自动识别船司</span>
          </div>
          <div class="body">
            <div class="zone" id="zone">
              <div class="ico">⬆</div>
              <div class="t">拖入文件，或点击选择</div>
              <div class="s">列顺序随意：能认出「船东简称」和「提单号」两列；认不出会标红，可单条删除</div>
            </div>
            <input type="file" id="file" accept=".csv,.txt" hidden>
            <textarea id="paste" placeholder="也可以直接粘贴，例如：&#10;COSCO,COSU9510184670&#10;SML,SHFO6B957700" style="margin-top:12px;display:none"></textarea>
            <div class="rows" id="rows"></div>
            <div class="statline" id="statline"></div>
            <div class="progressbar" id="bar"><i></i></div>
            <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
              <button class="btn" id="run" disabled>开始批量查询</button>
              <button class="btn ghost" id="pasteToggle">粘贴文本</button>
              <button class="btn ghost" id="clear" disabled>清空</button>
            </div>
          </div>
        </div>
        <div class="log" id="log"></div>
      </div>

      <!-- 结果 -->
      <div id="result"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const auth = () => ($('token').value.trim() ? {Authorization: `Bearer ${$('token').value.trim()}`} : {});
const ROUTES = [
  [/^ONEY/i,'ONE'],[/^MATS/i,'MATSON'],[/^(HDMU|SHAM)/i,'HMM'],[/^EGLV/i,'EVERGREEN'],
  [/^MAEU/i,'MAERSK'],[/^MEDU/i,'MSC'],[/^(TJN|CMDU)/i,'CMA_CGM'],[/^HLCU/i,'HAPAG_LLOYD'],
  [/^OOLU/i,'OOCL'],[/^(YMJ|YMLU)/i,'YML'],[/^(WHL|WHZ)/i,'WAN_HAI'],[/^(COSU|CSNU)/i,'COSCO'],
  [/^SH(GV|ZY|BW|FO|UH)/i,'SML'],[/^KORP/i,'KMTC'],[/^ZIMU/i,'ZIM'],
];
const route = (label, ref) => {
  const v = String(ref || '').toUpperCase().replace(/\s+/g, '');
  for (const [re, id] of ROUTES) if (re.test(v)) return id;
  return String(label || '').toUpperCase().replace(/[^A-Z_]/g, '') || 'COSCO';
};
const MILE = [
  ['milestone_pickup','起运节点','Laden Return Time','🏭'],
  ['milestone_departure','离港节点','ATD','⚓'],
  ['milestone_arrival','到港节点','ETA','🛳'],
  ['milestone_delivery','最终目的地','Cargo Pickup Estimated','📍'],
];

function card(item) {
  const sh = item.shipment, f = sh.fields ?? {};
  const nodes = MILE.map(([key, label, hint, icon], index) => {
    const value = f[key];
    const done = Boolean(value);
    const nearest = done && index === 1;
    return `<div class="node ${done ? 'done' : 'todo'}">
      <div class="icon">${done ? icon : icon}</div>
      <div class="badge">${done ? '已发生' : '预计'}</div>
      <div class="label">${label}</div>
      <div class="loc">${f.origin && index < 2 ? f.origin : (f.destination ?? '—')}</div>
      <div class="name">${hint}</div>
      <div class="time ${done ? 'actual' : ''}">${done ? '实际 ' + value : '待更新'}</div>
      ${nearest ? '<div class="nearest">最近已确认节点</div>' : ''}
    </div>`;
  }).join('');

  const containers = (sh.containers ?? []).map((c) => `<tr>
    <td><code>${c.number}</code></td><td>${c.type ?? '—'}</td><td>${c.movement ?? '—'}</td>
    <td>${c.terms ?? '—'}</td><td>${c.position ?? '—'}</td><td>${c.latest_status ?? '—'}</td><td>${c.status_time ?? '—'}</td>
  </tr>`).join('');

  const legs = (sh.legs ?? []).map((leg, index) => `<tr>
    <td>${index + 1}</td><td>SEA</td><td>${leg.vessel ?? '—'}</td><td>${leg.voyage ?? '—'}</td>
    <td>${leg.load_port ?? '—'}</td><td>${leg.discharge_port ?? '—'}</td>
    <td>${leg.etd ?? '—'}</td><td>${leg.atd ?? '—'}</td><td>${leg.eta ?? '—'}</td><td>${leg.ata ?? '—'}</td>
  </tr>`).join('');

  const events = (sh.events ?? []).slice(0, 15).map((event) => `<tr>
    <td>${event.time ?? event.time_raw ?? '—'}</td><td>${event.description ?? '—'}</td><td>${event.location ?? '—'}</td>
  </tr>`).join('');

  return `
  <div class="card">
    <div class="summary">
      <div><div class="k">${item.carrier.name}</div><div class="v big">${item.query.reference_submitted}</div>
        <div class="k" style="margin-top:6px">${item.carrier.scac ?? ''} · ${item.query.strategy}</div></div>
      <div><div class="k">起始地</div><div class="v">${f.origin ?? '—'}</div></div>
      <div><div class="k">目的地</div><div class="v">${f.destination ?? '—'}</div></div>
      <div><div class="k">实际离港</div><div class="v">${f.atd ?? f.milestone_departure ?? '—'}<small>${f.origin ?? ''}</small></div></div>
      <div><div class="k">预计到达最终目的地</div><div class="v">${f.eta ?? f.milestone_arrival ?? '—'}<small>${f.destination ?? ''}</small></div></div>
    </div>
    <div class="rowline">
      <span><span class="tag">运输条款 / 箱型</span> ${f.container_type ? `${f.container_type} × ${sh.container_count?.extracted ?? 0}` : '—'}</span>
      <span><span class="tag">船名航次</span> ${f.vessel ? `${f.vessel}${f.voyage ? ' / ' + f.voyage : ''}` : '—'}</span>
      <span><span class="tag">本票箱数</span> ${sh.container_count?.extracted ?? 0}${sh.container_count?.declared ? ` / 声明 ${sh.container_count.declared}` : ''}</span>
      <span class="badge-sm ${sh.status.state === 'UNKNOWN' ? 'bad' : 'ok'}">${sh.status.state}</span>
    </div>
    <div class="statusline"><span class="dot ok"></span>
      <b>最新报告状态</b> ${sh.status.latest_event ?? '—'}
      <span class="muted">${sh.status.latest_event_at ?? ''}</span>
    </div>
    ${(item.meta.warnings ?? []).length ? `<div class="warn">${item.meta.warnings.join('；')}</div>` : ''}
  </div>

  <div class="card">
    <h2>运输节点 <span style="float:right;font-weight:400">${MILE.filter(([k]) => f[k]).length} 个节点</span></h2>
    <div class="nodes">${nodes}</div>
    <p class="muted" style="font-size:12px;margin-top:10px">节点以船司报告为准，预计日期可能调整。</p>
  </div>

  ${containers ? `<div class="card"><h2>运输详情</h2>
    <table><thead><tr><th>箱号</th><th>箱型</th><th>运输方式</th><th>运输条款</th><th>当前位置</th><th>最新状态</th><th>状态时间</th></tr></thead>
    <tbody>${containers}</tbody></table></div>` : ''}

  ${legs ? `<div class="card"><h2>分段运输 Routing</h2>
    <table><thead><tr><th>段</th><th>运输</th><th>船名</th><th>航次</th><th>装载港</th><th>卸载港</th><th>预计离港</th><th>实际离港</th><th>预计到港</th><th>实际到港</th></tr></thead>
    <tbody>${legs}</tbody></table></div>` : ''}

  ${events ? `<div class="card"><h2>事件时间线</h2>
    <table><thead><tr><th>时间</th><th>事件</th><th>地点</th></tr></thead><tbody>${events}</tbody></table></div>` : ''}`;
}

async function submit(items) {
  $('log').textContent = `提交 ${items.length} 条…`;
  const response = await fetch('/jobs', {
    method: 'POST', headers: {'Content-Type': 'application/json', ...auth()},
    body: JSON.stringify({items}),
  });
  const job = await response.json();
  if (!response.ok) { $('log').textContent = '提交失败：' + JSON.stringify(job); return; }
  $('log').textContent = `job_id = ${job.job_id}`;
  const es = new EventSource(`/jobs/${job.job_id}/events`);
  es.addEventListener('progress', (event) => { $('log').textContent += '\n' + event.data; $('log').scrollTop = 1e6; });
  es.addEventListener('done', async () => { es.close(); await render(job.job_id); });
  await poll(job.job_id);
}

async function poll(jobId) {
  for (let i = 0; i < 240; i += 1) {
    const response = await fetch(`/jobs/${jobId}`, {headers: auth()});
    if (!response.ok) return;
    const job = await response.json();
    if (['completed', 'completed_with_gaps', 'failed', 'cancelled'].includes(job.status)) { await render(jobId); return; }
    await new Promise((r) => setTimeout(r, 2000));
  }
}

async function render(jobId) {
  const response = await fetch(`/jobs/${jobId}/result`, {headers: auth()});
  if (!response.ok) return;
  const data = await response.json();
  $('result').innerHTML = (data.shipments ?? []).map(card).join('') || '<div class="card empty">没有结果</div>';
}

$('query').addEventListener('click', () => {
  const reference = $('reference').value.trim();
  if (!reference) { $('reference').focus(); return; }
  submit([{carrier: $('carrier').value, reference}]);
});


/* ================= 自研导入面板：识别 → 预览 → 提交 ================= */
let queue = [];        // {carrier, reference, ok, note}
let jobId = null;

const HOSTS = {
  COSCO:'COSCO SHIPPING', SML:'SM LINE', HMM:'HMM', OOCL:'OOCL', MSC:'MSC',
  EVERGREEN:'EVERGREEN', YML:'YANG MING', ZIM:'ZIM', ONE:'ONE', KMTC:'KMTC',
  MAERSK:'MAERSK', HAPAG_LLOYD:'HAPAG-LLOYD', MATSON:'MATSON', CMA_CGM:'CMA CGM',
  WAN_HAI:'WAN HAI',
};

/** 识别一行的「船司 + 提单号」：先按单号前缀，再按文字标签，都不行标红 */
function recognize(cells) {
  const cleaned = cells.map((c) => String(c || '').trim()).filter(Boolean);
  if (!cleaned.length) return null;
  // 提单号：字母数字混合、≥8 位、至少一个字母和一个数字
  const refIndex = cleaned.findIndex((c) => /^[A-Za-z0-9][A-Za-z0-9\-_ ]{7,}$/.test(c) && /[A-Za-z]/.test(c) && /\d/.test(c));
  const reference = (refIndex >= 0 ? cleaned[refIndex] : cleaned[cleaned.length - 1] || '').replace(/\s+/g, '');
  if (!reference) return null;
  const label = cleaned.find((c, index) => index !== refIndex) || '';
  const byPrefix = route('', reference);
  const known = Object.prototype.hasOwnProperty.call(HOSTS, byPrefix);
  // 前缀识别不出来时，看文字里有没有船司名
  if (!known) {
    const byLabel = route(label, '');
    if (Object.prototype.hasOwnProperty.call(HOSTS, byLabel)) return {carrier: byLabel, reference, ok: true, note: '按名称识别'};
    return {carrier: byPrefix, reference, ok: false, note: '船司未识别'};
  }
  return {carrier: byPrefix, reference, ok: true, note: '按单号前缀识别'};
}

function renderQueue() {
  const rows = document.getElementById('rows');
  const stat = document.getElementById('statline');
  const run = document.getElementById('run');
  const clear = document.getElementById('clear');
  rows.innerHTML = queue.map((item, index) => `
    <span class="rowchip ${item.ok ? '' : 'bad'}" style="animation-delay:${Math.min(index * 25, 400)}ms">
      <b>${HOSTS[item.carrier] || item.carrier}</b><code>${item.reference}</code>
      <span class="x" data-index="${index}">✕</span>
    </span>`).join('');
  const okCount = queue.filter((item) => item.ok).length;
  const carriers = new Set(queue.filter((item) => item.ok).map((item) => item.carrier));
  stat.innerHTML = queue.length
    ? `<span>共 <b>${queue.length}</b> 条</span><span>可查询 <b>${okCount}</b></span>
       <span>船司 <b>${carriers.size}</b> 家</span>
       ${queue.length - okCount ? `<span style="color:#c0392b">未识别 <b>${queue.length - okCount}</b></span>` : ''}`
    : '';
  run.disabled = !okCount;
  clear.disabled = !queue.length;
}

function ingestText(text, source = 'file') {
  const raw = String(text || '').replace(/^\uFEFF/, '');
  const rows = raw.split(/\r?\n/).map((line) => line.split(/[,\t;]/)).filter((cells) => cells.some((c) => String(c).trim()));
  if (!rows.length) { document.getElementById('log').textContent = '没有解析到内容'; return; }
  const header = /提单|bl|bill|船东|carrier|单号/i.test(rows[0].join(' '));
  const body = header ? rows.slice(1) : rows;
  const parsed = body.map(recognize).filter(Boolean);
  queue = parsed;
  document.getElementById('log').textContent = `已从${source === 'file' ? '文件' : '文本'}识别 ${parsed.length} 条`;
  renderQueue();
}

/* 拖拽 / 选择 / 粘贴 */
const zone = document.getElementById('zone');
zone.addEventListener('click', () => document.getElementById('file').click());
zone.addEventListener('dragover', (event) => { event.preventDefault(); document.getElementById('import').classList.add('dragging'); });
zone.addEventListener('dragleave', () => document.getElementById('import').classList.remove('dragging'));
zone.addEventListener('drop', async (event) => {
  event.preventDefault();
  document.getElementById('import').classList.remove('dragging');
  const file = event.dataTransfer.files[0];
  if (file) ingestText(await file.text(), 'file');
});
document.getElementById('file').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (file) ingestText(await file.text(), 'file');
});
document.getElementById('pasteToggle').addEventListener('click', () => {
  const box = document.getElementById('paste');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') box.focus();
});
document.getElementById('paste').addEventListener('input', (event) => ingestText(event.target.value, 'text'));
document.getElementById('clear').addEventListener('click', () => {
  queue = []; document.getElementById('paste').value = '';
  document.getElementById('rows').innerHTML = ''; document.getElementById('statline').innerHTML = '';
  document.getElementById('result').innerHTML = '';
  document.getElementById('bar').firstElementChild.style.width = '0';
  renderQueue();
});
document.getElementById('rows').addEventListener('click', (event) => {
  const index = Number(event.target?.dataset?.index);
  if (Number.isNaN(index)) return;
  queue.splice(index, 1);
  renderQueue();
});

/* 批量执行：带进度条 + 逐条状态 */
document.getElementById('run').addEventListener('click', async () => {
  const items = queue.filter((item) => item.ok).map(({carrier, reference}) => ({carrier, reference}));
  if (!items.length) return;
  const runBtn = document.getElementById('run');
  runBtn.classList.add('loading'); runBtn.disabled = true;
  document.getElementById('result').innerHTML = '<div class="card"><div class="skeleton" style="width:38%"></div><div class="skeleton" style="width:72%"></div><div class="skeleton" style="width:56%"></div></div>';
  const response = await fetch('/jobs', {
    method: 'POST', headers: {'Content-Type': 'application/json', ...auth()},
    body: JSON.stringify({items}),
  });
  const job = await response.json();
  runBtn.classList.remove('loading');
  if (!response.ok) { document.getElementById('log').textContent = '提交失败：' + JSON.stringify(job); renderQueue(); return; }
  jobId = job.job_id;
  document.getElementById('log').textContent = `job_id = ${jobId}`;
  const bar = document.getElementById('bar').firstElementChild;
  const es = new EventSource(`/jobs/${jobId}/events`);
  es.addEventListener('progress', (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.total) bar.style.width = Math.round(((data.done || 0) / data.total) * 100) + '%';
    } catch { /* ignore */ }
    document.getElementById('log').textContent += '\n' + event.data;
  });
  es.addEventListener('done', async () => { es.close(); bar.style.width = '100%'; await render(jobId); renderQueue(); });
  await poll(jobId);
});

/* 单票查询按钮：沿用上面的表单 */
document.getElementById('query').addEventListener('click', async () => {
  const reference = document.getElementById('reference').value.trim();
  if (!reference) return document.getElementById('reference').focus();
  const button = document.getElementById('query');
  button.classList.add('loading'); button.disabled = true;
  await submit([{carrier: document.getElementById('carrier').value, reference}]);
  button.classList.remove('loading'); button.disabled = false;
});
</script>
