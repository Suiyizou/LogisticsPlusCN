worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
# Fixed destinations only. This gateway cannot select an arbitrary upstream.
stream {
  server { listen 8080; proxy_pass frontend:80; proxy_timeout 600s; }
  server { listen 8081; proxy_pass backend:8080; proxy_timeout 600s; }
  server { listen 3306; proxy_pass mysql:3306; proxy_timeout 600s; }
}
