worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 64; }
# No TLS termination, credentials, HTTP logging, arbitrary host selection, or published ports.
stream {
  resolver 127.0.0.11 valid=60s ipv6=off;
  map $ssl_preread_server_name $fixed_destination {
    api.deepseek.com api.deepseek.com:443;
    default 127.0.0.1:1;
  }
  server {
    listen 172.30.254.2:443;
    allow 172.30.254.3;
    deny all;
    ssl_preread on;
    proxy_connect_timeout 15s;
    proxy_timeout 180s;
    proxy_pass $fixed_destination;
  }
}
