# Optional preview-only route. The backend never joins the external edge network.
services:
  backend:
    extra_hosts:
      - "api.deepseek.com:172.30.254.2"
    networks:
      app: {}
      data: {}
      preview-llm:
        ipv4_address: 172.30.254.3
  llm-relay:
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: cargo-ui-preview-llm-relay
    volumes:
      - ./docker/dev-preview/llm-relay.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      preview-llm:
        ipv4_address: 172.30.254.2
      preview-edge: {}
networks:
  preview-llm:
    name: cargo-ui-preview-llm
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/29
