# Requires Compose >= 2.24.4. Use with docker-compose.yml and project cargo-staging.
# Ports, names and volumes are deliberately isolated from the existing installation.
services:
  mysql:
    container_name: cargo-staging-mysql
    ports: !reset []
    mem_limit: 512m
  backend:
    container_name: cargo-staging-backend
    ports: !reset []
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=10.0
  tracking:
    container_name: cargo-staging-tracking
    mem_limit: 768m
    shm_size: 256mb
    environment:
      PLAYWRIGHT_MAX_CONCURRENCY: "1"
      COSCO_PLAYWRIGHT_MAX_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=192
  frontend:
    container_name: cargo-staging-frontend
    ports: !override
      - "127.0.0.1:${STAGING_FRONTEND_PORT:-18080}:80"
    mem_limit: 128m
volumes:
  mysql-data:
    external: false
    name: cargo-staging-mysql-data
  workspace-files:
    name: cargo-staging-workspace-files
  backend-secrets:
    name: cargo-staging-backend-secrets
networks:
  app:
    name: cargo-staging-app
  data:
    name: cargo-staging-data
