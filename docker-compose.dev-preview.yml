# Run only through scripts/dev-preview.mjs. All names, ports, networks and storage are isolated.
services:
  mysql:
    container_name: cargo-ui-preview-mysql
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --event-scheduler=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${PREVIEW_MYSQL_ROOT_PASSWORD:?Generated by dev-preview script}
      MYSQL_DATABASE: cargo_preview
      MYSQL_USER: cargo_preview
      MYSQL_PASSWORD: ${PREVIEW_MYSQL_PASSWORD:?Generated by dev-preview script}
    ports: !reset []
    volumes: !override
      - mysql-data:/var/lib/mysql
  backend:
    container_name: cargo-ui-preview-backend
    image: cargo-ui-preview-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cargo_preview?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: cargo_preview
      SPRING_DATASOURCE_PASSWORD: ${PREVIEW_MYSQL_PASSWORD:?Generated by dev-preview script}
      SPRING_FLYWAY_ENABLED: "true"
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_USERNAME: ""
      APP_BOOTSTRAP_ADMIN_PASSWORD: ""
      APP_TRACKING_AUTO_REFRESH_ENABLED: "false"
      APP_TRACKING_SUPPLEMENTAL_RETRY_ENABLED: "false"
      SPRING_AI_CHAT_MODEL: none
      SPRING_AI_OPENAI_API_KEY: ""
      SPRING_AI_OPENAI_BASE_URL: http://127.0.0.1:9
      # @Scheduled cleanup has no enabled flag; prevent it from touching imported historical rows.
      SPRING_APPLICATION_JSON: '{"app":{"workspace-files":{"cleanup-initial-delay-ms":315360000000,"cleanup-interval-ms":315360000000}}}'
    ports: !reset []
    volumes: !override
      - workspace-files:/app/uploads
      - shipment-files:/app/shipment-files
      - backend-secrets:/app/secrets
  tracking:
    container_name: cargo-ui-preview-tracking
    image: cargo-ui-preview-tracking:local
  frontend:
    container_name: cargo-ui-preview-frontend
    image: cargo-ui-preview-frontend:local
    build:
      args:
        VITE_TRACKING_WORKBENCH_URL: /workspace/tracking/overview
    ports: !reset []
  gateway:
    image: nginx:alpine
    container_name: cargo-ui-preview-gateway
    ports:
      - "127.0.0.1:18088:8080"
      - "127.0.0.1:18089:8081"
      - "127.0.0.1:13316:3306"
    volumes:
      - ./docker/dev-preview/gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - data
      - preview-edge
volumes:
  mysql-data:
    external: false
    name: cargo-ui-preview-mysql-data
  workspace-files:
    name: cargo-ui-preview-workspace-files
  shipment-files:
    name: cargo-ui-preview-shipment-files
  backend-secrets:
    name: cargo-ui-preview-backend-secrets
networks:
  app:
    name: cargo-ui-preview-app
    internal: true
  data:
    name: cargo-ui-preview-data
    internal: true
  preview-edge:
    name: cargo-ui-preview-edge
